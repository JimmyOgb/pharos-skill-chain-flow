[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pharos-skill-chain-flow"
version = "0.1.0"
description = "Pharos Skill + Chain MCP Flow — Live Network Operations Advisor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "JimmyOgb", email = "Jiangy4545@gmail.com" }
]
keywords = ["pharos", "mcp", "model-context-protocol", "skill-engine", "blockchain", "composition"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
pharos-flow = "flow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
